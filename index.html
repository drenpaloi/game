<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Catcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background: #0d0d0d;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            position: relative;
        }
        /* Stars background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4%),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 3%),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2%),
                radial-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1) 1px, transparent 3%);
            background-size: 550px 550px, 350px 350px, 250px 250px, 150px 150px;
            background-position: 0 0, 40px 60px, 130px 270px, 70px 100px;
            animation: twinkle 10s linear infinite;
        }
        @keyframes twinkle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .screen.hidden {
            display: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0,191,255,.7);
            letter-spacing: 2px;
        }
        .character-options {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        .character-option {
            position: relative;
            width: 100px;
            height: 120px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .character-option:hover {
            transform: scale(1.05);
        }
        .character-option.selected {
            box-shadow: 0 0 20px rgba(0,191,255,.8);
        }
        .character-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px solid;
            transition: all 0.3s;
        }
        .character-option.selected .character-circle {
            transform: scale(1.1);
            box-shadow: 0 0 15px currentColor;
        }
        .character-name {
            margin-top: 10px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: rgba(0,191,255,.2);
            border: 2px solid rgba(0,191,255,.5);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #startButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #startButton:enabled:hover {
            background: rgba(0,191,255,.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,191,255,.4);
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #character {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid;
            transition: left 0.1s;
        }
        .star {
            position: absolute;
            top: -20px;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #fff, #ff0);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,.7);
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }
        #scoreDisplay, #livesDisplay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            background: rgba(0,0,0,.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
        #livesDisplay {
            left: auto;
            right: 20px;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            display: none;
        }
        #gameOverScreen.show {
            display: flex;
        }
        #gameOverScreen h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        #gameOverScreen p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        #restartButton {
            padding: 12px 25px;
            font-size: 1.2rem;
            background: rgba(255,69,0,.2);
            border: 2px solid rgba(255,69,0,.5);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #restartButton:hover {
            background: rgba(255,69,0,.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Character Select Screen -->
    <div id="selectScreen" class="screen">
        <h1>Choose Your Character</h1>
        <div class="character-options">
            <div class="character-option" data-name="Explorer" data-color="#1e90ff">
                <div class="character-circle">🧭</div>
                <div class="character-name">Explorer</div>
            </div>
            <div class="character-option" data-name="Scout" data-color="#ff4500">
                <div class="character-circle">🔭</div>
                <div class="character-name">Scout</div>
            </div>
            <div class="character-option" data-name="Pilot" data-color="#32cd32">
                <div class="character-circle">✈️</div>
                <div class="character-name">Pilot</div>
            </div>
        </div>
        <button id="startButton" disabled>Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen hidden">
        <div id="gameContainer">
            <div id="scoreDisplay">Score: 0</div>
            <div id="livesDisplay">Lives: 3</div>
            <div id="character"></div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <h2>Game Over</h2>
        <p id="finalScore"></p>
        <button id="restartButton">Play Again</button>
    </div>

    <script>
        const selectScreen = document.getElementById('selectScreen');
        const gameScreen = document.getElementById('gameScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const characterOptions = document.querySelectorAll('.character-option');
        const characterDisplay = document.getElementById('character');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const gameContainer = document.getElementById('gameContainer');

        let selectedCharacter = null;
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let characterX = 50; // percentage
        const characterSpeed = 5; // pixels per frame
        const starSpeed = 2; // pixels per frame
        const starSize = 20;
        let stars = [];
        let animationFrameId = null;
        let lastStarSpawn = 0;
        const starSpawnInterval = 1500; // ms

        // Character selection
        characterOptions.forEach(option => {
            option.addEventListener('click', () => {
                // Deselect all
                characterOptions.forEach(opt => opt.classList.remove('selected'));
                // Select this
                option.classList.add('selected');
                selectedCharacter = {
                    name: option.dataset.name,
                    color: option.dataset.color
                };
                startButton.disabled = false;
            });
        });

        // Start game
        startButton.addEventListener('click', () => {
            if (!selectedCharacter) return;
            initGame();
            selectScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
        });

        // Restart game
        restartButton.addEventListener('click', () => {
            gameOverScreen.classList.remove('show');
            selectScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            // Reset UI
            characterOptions.forEach(opt => opt.classList.remove('selected'));
            startButton.disabled = true;
            selectedCharacter = null;
        });

        function initGame() {
            score = 0;
            lives = 3;
            characterX = 50;
            updateUI();
            // Set character appearance
            characterDisplay.style.backgroundColor = selectedCharacter.color;
            characterDisplay.style.borderColor = selectedCharacter.color;
            characterDisplay.textContent = getCharacterIcon(selectedCharacter.name);
            // Clear stars
            stars.forEach(star => star.element.remove());
            stars = [];
            lastStarSpawn = performance.now();
            gameActive = true;
            gameLoop();
        }

        function getCharacterIcon(name) {
            switch(name) {
                case 'Explorer': return '🧭';
                case 'Scout': return '🔭';
                case 'Pilot': return '✈️';
                default: return '👤';
            }
        }

        function updateUI() {
            scoreDisplay.textContent = `Score: ${score}`;
            livesDisplay.textContent = `Lives: ${lives}`;
            finalScoreDisplay.textContent = `Final Score: ${score}`;
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            // Spawn stars
            if (timestamp - lastStarSpawn > starSpawnInterval) {
                spawnStar();
                lastStarSpawn = timestamp;
            }

            // Update stars
            updateStars(timestamp);

            // Request next frame
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function spawnStar() {
            const star = document.createElement('div');
            star.className = 'star';
            // Random x position within container, ensuring star fully visible
            const x = Math.random() * (gameContainer.clientWidth - starSize);
            star.style.left = `${x}px`;
            star.style.top = `-${starSize}px`;
            gameContainer.appendChild(star);
            stars.push({
                element: star,
                x: x,
                y: -starSize
            });
        }

        function updateStars(timestamp) {
            stars.forEach((star, index) => {
                // Move star down
                star.y += starSpeed;
                star.element.style.top = `${star.y}px`;

                // Check if star is caught (reached character zone)
                const characterBottom = gameContainer.clientHeight - 80; // approx bottom of character
                if (star.y > characterBottom) {
                    // Check horizontal overlap
                    const characterLeft = gameContainer.clientWidth * (characterX/100) - 40; // half width
                    const characterRight = characterLeft + 80;
                    const starLeft = star.x;
                    const starRight = star.x + starSize;

                    if (starRight > characterLeft && starLeft < characterRight) {
                        // Caught!
                        score++;
                        updateUI();
                    } else {
                        // Missed
                        lives--;
                        updateUI();
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    // Remove star
                    star.element.remove();
                    stars.splice(index, 1);
                }

                // Remove if off screen bottom (should be caught above, but safety)
                if (star.y > gameContainer.clientHeight) {
                    star.element.remove();
                    stars.splice(index, 1);
                }
            });
        }

        function endGame() {
            gameActive = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            updateUI();
        }

        // Keyboard controls for character movement
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            const containerWidth = gameContainer.clientWidth;
            const maxX = 100 - (80 / containerWidth * 100); // ensure character stays within bounds
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                characterX = Math.max(0, characterX - (characterSpeed / containerWidth * 100));
                characterDisplay.style.left = `${characterX}%`;
            } else if (e.key === 'ArrowRight' || e.key === 'd') {
                characterX = Math.min(maxX, characterX + (characterSpeed / containerWidth * 100));
                characterDisplay.style.left = `${characterX}%`;
            }
        });

        // Optional touch controls (left/right halves)
        let touchStartX = 0;
        gameContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });
        gameContainer.addEventListener('touchend', (e) => {
            if (!gameActive) return;
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchEndX - touchStartX;
            const containerWidth = gameContainer.clientWidth;
            if (Math.abs(diff) > 30) {
                if (diff < 0) {
                    // swipe left
                    characterX = Math.max(0, characterX - (characterSpeed / containerWidth * 100));
                } else {
                    // swipe right
                    const maxX = 100 - (80 / containerWidth * 100);
                    characterX = Math.min(maxX, characterX + (characterSpeed / containerWidth * 100));
                }
                characterDisplay.style.left = `${characterX}%`;
            }
        }, { passive: true });

        // Initialize on load (show select screen)
        window.addEventListener('load', () => {
            selectScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
